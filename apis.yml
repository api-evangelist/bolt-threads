aid: bolt-threads
name: Bolt Threads
description: >-
  Bolt Threads, Inc. was a San Francisco Bay Area biomaterials company founded in 2009 to
  engineer protein- and mycelium-based materials. It is best known for Microsilk, a
  bioengineered spider-silk fiber; Mylo, a mycelium-derived leather alternative developed
  with partners including adidas, Kering, Lululemon, Patagonia and Stella McCartney; and
  b-silk protein, a silk-protein ingredient for beauty and personal care. The company went
  public on Nasdaq in August 2024 via a SPAC business combination under the ticker BSLK,
  halted Mylo production, was suspended from Nasdaq in January 2026, and now trades OTC
  Pink while deregistering with the SEC. Its website serves only a notice that the company
  is no longer operating. Bolt Threads was a materials manufacturer, not a software vendor,
  and never operated a developer program, public API, SDK, or machine-readable specification.
